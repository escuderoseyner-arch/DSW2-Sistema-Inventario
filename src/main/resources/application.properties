spring.application.name=SistemaGestionInventarios
server.port=${PORT:8080}

# Conexion a PostgreSQL.
# Los valores reales van en variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# NO subir contrasenas reales a GitHub. Lo que va despues de ":" es el valor local por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
