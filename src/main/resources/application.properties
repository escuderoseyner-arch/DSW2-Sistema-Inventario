
spring.application.name=SistemaGestionInventarios
server.port=${PORT:8080}

# Conexion a PostgreSQL
# Configurar DB_URL, DB_USER y DB_PASSWORD en las variables de entorno.
# No guardar contrasenas reales en este archivo ni subirlas a GitHub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Login con JWT (en la nube se cambia con la variable JWT_SECRET)
jwt.secret=${JWT_SECRET:Qz3ptPdoTRxjOsWnFrFLkjG3TZJV5E945auFixwbCHAT/f97KMdlDelQlHlc/a8op14qv7EtuS5s8FbcFXjZoA==}
# Duracion del token: 8 horas
jwt.expiracion-ms=28800000

# Contrasena del usuario admin que se crea al iniciar (en la nube: variable ADMIN_PASSWORD)
app.admin-password=${ADMIN_PASSWORD:admin123}
