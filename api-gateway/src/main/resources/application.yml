server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**

        - id: ms-productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/productos/**,/api/categorias/**

        - id: ms-movimientos
          uri: http://localhost:8083
          predicates:
            - Path=/api/movimientos/**
