server.port=8083
spring.application.name=ms-movimientos

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_movimientos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URL del ms-productos para comunicacion entre microservicios
ms-productos.url=http://localhost:8082
